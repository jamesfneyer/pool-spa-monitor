version: 1
backend:
  phases:
    preBuild:
      commands:
        - nvm install
        - nvm use 20
        - corepack enable
        - export CI=1
        - export NODE_OPTIONS='--max-old-space-size=5632'
        - export NEXT_TELEMETRY_DISABLED=1
        - pnpm install --frozen-lockfile --prefer-offline
    build:
      commands:
        - test -f amplify/auth/resource.ts || (echo "MISSING amplify/auth/resource.ts" && exit 1)
        - test -f amplify/backend.ts || (echo "MISSING amplify/backend.ts" && exit 1)
        - echo "Deploying backend for branch $AWS_BRANCH"
        - |
          case "${AWS_BRANCH}" in
            main)
              echo "Deploying production backend..."
              pnpm exec ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
              ;;
            staging)
              echo "Deploying staging backend..."
              pnpm exec ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
              ;;
            pr-*)
              echo "Deploying ephemeral preview backend..."
              pnpm exec ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
              ;;
            *)
              echo "Reusing staging backend outputs for feature branch..."
              pnpm exec ampx generate outputs --branch staging --app-id $AWS_APP_ID
              ;;
          esac
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - export NODE_OPTIONS='--max-old-space-size=5632'
        - export GENERATE_SOURCEMAP=false
        - export NEXT_TELEMETRY_DISABLED=1
        # Backend preBuild already installed deps in this job; fallback if cache miss.
        - test -d node_modules || pnpm install --frozen-lockfile --prefer-offline
    build:
      commands:
        - export NODE_OPTIONS='--max-old-space-size=5632'
        - export GENERATE_SOURCEMAP=false
        - export NEXT_TELEMETRY_DISABLED=1
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      # pnpm store (not node_modules) — fast installs without OOM during cache compression.
      - .pnpm-store/**/*
      - .next/cache/**/*
